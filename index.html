<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #ffffff 0%, #f0f4ff 50%, #ffffff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Animated background elements */
        .background-blur {
            position: fixed;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            filter: blur(80px);
            top: -100px;
            left: -100px;
            z-index: 1;
        }

        .background-blur:nth-child(2) {
            width: 250px;
            height: 250px;
            top: auto;
            bottom: -50px;
            left: auto;
            right: -50px;
            background: rgba(200, 220, 255, 0.3);
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 800px;
            padding: 40px;
        }

        /* Glass Effect Text */
        .glass-text {
            font-size: 4rem;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.25);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            padding: 40px 60px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
            color: rgba(50, 50, 100, 0.9);
            letter-spacing: 2px;
            margin-bottom: 30px;
            animation: slideIn 0.8s ease-out;
        }

        .glass-subtext {
            font-size: 1.3rem;
            background: rgba(255, 255, 255, 0.2);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            padding: 20px 40px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: rgba(50, 50, 100, 0.8);
            box-shadow: 0 4px 15px rgba(31, 38, 135, 0.1);
            margin-bottom: 30px;
            animation: slideIn 0.8s ease-out 0.2s both;
        }

        /* Glass Effect Button */
        .glass-button {
            background: rgba(255, 255, 255, 0.3);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 15px 40px;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            color: rgba(50, 50, 100, 0.9);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(31, 38, 135, 0.1);
            font-weight: 600;
            animation: slideIn 0.8s ease-out 0.4s both;
        }

        .glass-button:hover {
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 30px rgba(31, 38, 135, 0.2);
            transform: translateY(-2px);
        }

        .glass-button:active {
            transform: translateY(0);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .glass-text {
                font-size: 2.5rem;
                padding: 30px 40px;
            }

            .glass-subtext {
                font-size: 1rem;
                padding: 15px 30px;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="background-blur"></div>
    <div class="background-blur"></div>

    <div class="container">
        <h1 class="glass-text">Welcome</h1>
        <p class="glass-subtext">Discover something amazing</p>
        <button class="glass-button">Get Started</button>
    </div>
</body>
</html>
