<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Induction - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
        }

        .bg-blur {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            z-index: 1;
        }

        .blur-1 {
            width: 400px;
            height: 400px;
            background: rgba(100, 150, 255, 0.2);
            top: -150px;
            left: -100px;
        }

        .blur-2 {
            width: 350px;
            height: 350px;
            background: rgba(150, 100, 255, 0.15);
            bottom: -80px;
            right: -50px;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 380px;
            padding: 20px;
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .welcome-screen.hidden {
            display: none;
        }

        .login-screen {
            display: none;
        }

        .login-screen.active {
            display: block;
        }

        .card {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 40px 35px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            animation: slideUp 0.6s ease-out;
        }

        .card h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: #666666;
            text-align: center;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .card p {
            text-align: center;
            color: #999999;
            margin-bottom: 25px;
            font-size: 0.9rem;
            font-weight: 300;
        }

        .welcome-message {
            text-align: center;
            color: #666666;
            margin-bottom: 10px;
        }

        .welcome-message h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .welcome-message p {
            color: #999999;
            font-size: 0.95rem;
            font-weight: 300;
        }

        .option-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, rgba(100, 150, 255, 0.4), rgba(150, 100, 255, 0.3));
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            color: #666666;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            backdrop-filter: blur(10px);
        }

        .option-btn:hover {
            background: linear-gradient(135deg, rgba(100, 150, 255, 0.5), rgba(150, 100, 255, 0.4));
            box-shadow: 0 4px 15px rgba(100, 150, 255, 0.2);
            transform: translateY(-2px);
        }

        .option-btn:active {
            transform: translateY(0);
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #999999;
            padding: 10px;
            margin-bottom: 15px;
            cursor: pointer;
            text-align: center;
            font-size: 0.9rem;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #777777;
        }

        .role-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px;
            border-radius: 12px;
        }

        .role-selector.hidden {
            display: none;
        }

        .role-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #bbbbbb;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        .role-btn.active {
            background: rgba(255, 255, 255, 0.3);
            color: #666666;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .role-btn:hover {
            color: #888888;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #777777;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            font-size: 0.9rem;
            color: #666666;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            font-weight: 400;
        }

        .form-group input::placeholder {
            color: #cccccc;
        }

        .form-group input:focus {
            outline: none;
            border-color: rgba(100, 150, 255, 0.5);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 0 3px rgba(100, 150, 255, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 11px;
            background: linear-gradient(135deg, rgba(100, 150, 255, 0.4), rgba(150, 100, 255, 0.3));
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            color: #666666;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            backdrop-filter: blur(10px);
            margin-top: 5px;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, rgba(100, 150, 255, 0.5), rgba(150, 100, 255, 0.4));
            box-shadow: 0 4px 15px rgba(100, 150, 255, 0.2);
            transform: translateY(-2px);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 35px 25px;
            }

            .card h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-blur blur-1"></div>
    <div class="bg-blur blur-2"></div>

    <div class="container">
        <div class="welcome-screen" id="welcomeScreen">
            <div class="card">
                <div class="welcome-message">
                    <h2>Induction</h2>
                    <p>Let's Get Started!</p>
                </div>

                <div class="option-buttons">
                    <button class="option-btn" onclick="goToScreen('login')">Login</button>
                    <button class="option-btn" onclick="goToScreen('signup')">Sign Up</button>
                </div>
            </div>
        </div>

        <div class="login-screen" id="loginScreen">
            <button class="back-btn" onclick="goBack()">← Back</button>

            <div class="card">
                <h1 id="screenTitle">Login</h1>
                <p id="screenSubtitle">Welcome Back</p>

                <div class="role-selector" id="roleSelector">
                    <button class="role-btn active" type="button" onclick="selectRole('student', this)">Student</button>
                    <button class="role-btn" type="button" onclick="selectRole('admin', this)">Admin</button>
                </div>

                <form id="loginForm" onsubmit="handleSubmit(event)">
                    <div class="form-group" id="nameGroup" style="display: none;">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="Enter your full name">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>

                    <button type="submit" class="login-btn" id="submitBtn">Login</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        let currentRole = 'student';
        let currentMode = 'login';

        function resetForm() {
            document.getElementById('loginForm').reset();
        }

        function setStudentAsDefaultRole() {
            currentRole = 'student';

            document.querySelectorAll('.role-btn').forEach((btn) => {
                btn.classList.remove('active');
            });

            document.querySelector('.role-btn').classList.add('active');
        }

        function goToScreen(mode) {
            currentMode = mode;
            resetForm();

            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.add('active');

            const screenTitle = document.getElementById('screenTitle');
            const screenSubtitle = document.getElementById('screenSubtitle');
            const nameGroup = document.getElementById('nameGroup');
            const submitBtn = document.getElementById('submitBtn');
            const roleSelector = document.getElementById('roleSelector');

            if (mode === 'signup') {
                screenTitle.textContent = 'Student Sign Up';
                screenSubtitle.textContent = 'Create Your Student Account';
                nameGroup.style.display = 'block';
                submitBtn.textContent = 'Sign Up';
                roleSelector.classList.add('hidden');
                setStudentAsDefaultRole();
            } else {
                screenTitle.textContent = 'Login';
                screenSubtitle.textContent = 'Student or Admin Login';
                nameGroup.style.display = 'none';
                submitBtn.textContent = 'Login';
                roleSelector.classList.remove('hidden');
                setStudentAsDefaultRole();
            }
        }

        function goBack() {
            document.getElementById('loginScreen').classList.remove('active');
            document.getElementById('welcomeScreen').classList.remove('hidden');
            setStudentAsDefaultRole();
            resetForm();
        }

        function selectRole(role, buttonElement) {
            if (currentMode !== 'login') {
                return;
            }

            currentRole = role;

            document.querySelectorAll('.role-btn').forEach((btn) => {
                btn.classList.remove('active');
            });

            buttonElement.classList.add('active');
        }

        function handleSubmit(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const name = document.getElementById('name').value.trim();

            if (currentMode === 'signup') {
                if (!name) {
                    alert('Please enter your full name.');
                    return;
                }

                const role = 'student';
                console.log(`Sign up attempt: ${name}, ${email} as ${role}`);
                alert(`Student sign up successful for ${email}. Welcome to Induction!`);
                return;
            }

            console.log(`Login attempt: ${email} as ${currentRole}`);

            if (currentRole === 'admin') {
                alert(`Admin login successful for ${email}. Redirecting to admin dashboard...`);
            } else {
                alert(`Student login successful for ${email}. Redirecting to induction...`);
            }
        }
    </script>
</body>
</html>
