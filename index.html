<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Induction - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
       
            * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    min-height: 100vh;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
    overflow-x: hidden;
    position: relative;
    padding: 20px;
}

/* =========================
   BACKGROUND BLURS
========================= */

.bg-blur {
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.3;
    z-index: 1;
}

.blur-1 {
    width: 420px;
    height: 420px;
    background: rgba(100, 150, 255, 0.2);
    top: -180px;
    left: -120px;
}

.blur-2 {
    width: 380px;
    height: 380px;
    background: rgba(180, 120, 255, 0.18);
    bottom: -120px;
    right: -80px;
}

/* =========================
   MAIN CONTAINER
========================= */

.container {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 420px;
}

/* =========================
   WELCOME / LOGIN SCREENS
========================= */

.welcome-screen {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.welcome-screen.hidden {
    display: none;
}

.login-screen {
    display: none;
}

.login-screen.active {
    display: block;
}

/* =========================
   GLASS CARD
========================= */

.card {
    background: rgba(255, 255, 255, 0.22);

    border: 1px solid rgba(255, 255, 255, 0.4);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border-radius: 24px;

    padding: 40px 35px;

    box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);

    animation: slideUp 0.5s ease;
}

/* =========================
   TITLES
========================= */

.card h1 {
    font-size: 1.9rem;
    color: #666666;
    text-align: center;
    margin-bottom: 6px;
    font-weight: 700;
    letter-spacing: -0.5px;
}

.card p {
    text-align: center;
    color: #999999;
    margin-bottom: 28px;
    font-size: 0.92rem;
    font-weight: 300;
}

/* =========================
   WELCOME MESSAGE
========================= */

.welcome-message {
    text-align: center;
    margin-bottom: 18px;
}

.welcome-message h2 {
    font-size: 1.8rem;
    color: #666666;
    font-weight: 700;
    margin-bottom: 8px;
}

.welcome-message p {
    color: #999999;
    font-size: 0.95rem;
    font-weight: 300;
}

/* =========================
   BUTTONS
========================= */

.option-buttons {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.option-btn,
.login-btn,
.admin-create-btn,
.logout-btn {
    width: 100%;

    padding: 13px;

    border-radius: 14px;

    border: 1px solid rgba(255, 255, 255, 0.35);

    background:
        linear-gradient(
            135deg,
            rgba(100, 150, 255, 0.38),
            rgba(170, 120, 255, 0.28)
        );

    color: #666666;

    font-size: 0.95rem;
    font-weight: 600;

    cursor: pointer;

    transition: all 0.3s ease;

    font-family: 'Poppins', sans-serif;

    backdrop-filter: blur(12px);
}

.option-btn:hover,
.login-btn:hover,
.admin-create-btn:hover,
.logout-btn:hover {
    transform: translateY(-2px);

    background:
        linear-gradient(
            135deg,
            rgba(100, 150, 255, 0.5),
            rgba(170, 120, 255, 0.38)
        );

    box-shadow:
        0 8px 24px rgba(100, 150, 255, 0.2);
}

.option-btn:active,
.login-btn:active,
.admin-create-btn:active,
.logout-btn:active {
    transform: scale(0.98);
}

/* =========================
   BACK BUTTON
========================= */

.back-btn {
    width: 100%;

    margin-bottom: 16px;

    padding: 11px;

    border-radius: 12px;

    border: 1px solid rgba(255, 255, 255, 0.25);

    background: rgba(255, 255, 255, 0.12);

    color: #888888;

    font-size: 0.9rem;
    font-weight: 500;

    cursor: pointer;

    transition: all 0.3s ease;

    backdrop-filter: blur(10px);
}

.back-btn:hover {
    background: rgba(255, 255, 255, 0.18);
    color: #666666;
}

/* =========================
   FORM GROUPS
========================= */

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;

    margin-bottom: 7px;

    color: #777777;

    font-size: 0.85rem;
    font-weight: 500;
}

.form-group input {
    width: 100%;

    padding: 12px 14px;

    border-radius: 12px;

    border: 1px solid rgba(255, 255, 255, 0.3);

    background: rgba(255, 255, 255, 0.15);

    color: #666666;

    font-size: 0.92rem;

    font-family: 'Poppins', sans-serif;

    transition: all 0.3s ease;

    backdrop-filter: blur(10px);
}

.form-group input::placeholder {
    color: #c5c5c5;
}

.form-group input:focus {
    outline: none;

    border-color: rgba(100, 150, 255, 0.5);

    background: rgba(255, 255, 255, 0.25);

    box-shadow:
        0 0 0 4px rgba(100, 150, 255, 0.08);
}

/* =========================
   SECURITY BANNER
========================= */

.security-banner {
    width: 100%;

    padding: 10px 14px;

    margin-bottom: 18px;

    border-radius: 12px;

    background: rgba(255, 220, 120, 0.12);

    border: 1px solid rgba(255, 220, 120, 0.25);

    color: #b28700;

    font-size: 0.8rem;
    font-weight: 500;

    text-align: center;
}

/* =========================
   ADMIN DASHBOARD
========================= */

.admin-dashboard {
    display: none;

    margin-top: 20px;

    animation: fadeIn 0.4s ease;
}

.admin-dashboard.active {
    display: block;
}

/* =========================
   ADMIN HEADER
========================= */

.admin-header {
    margin-bottom: 22px;
    text-align: center;
}

.admin-header h2 {
    color: #666666;
    font-size: 1.4rem;
    font-weight: 700;
}

.admin-header p {
    color: #999999;
    font-size: 0.85rem;
    margin-top: 4px;
}

/* =========================
   ADMIN PANEL
========================= */

.admin-panel {
    background: rgba(255, 255, 255, 0.14);

    border: 1px solid rgba(255, 255, 255, 0.25);

    border-radius: 18px;

    padding: 22px;

    backdrop-filter: blur(14px);
}

/* =========================
   ADMIN USER CARD
========================= */

.admin-user-card {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 14px 16px;

    margin-bottom: 12px;

    border-radius: 14px;

    background: rgba(255, 255, 255, 0.16);

    border: 1px solid rgba(255, 255, 255, 0.2);

    transition: all 0.3s ease;
}

.admin-user-card:hover {
    transform: translateY(-2px);

    background: rgba(255, 255, 255, 0.22);
}

.admin-user-info h3 {
    color: #666666;
    font-size: 0.92rem;
    font-weight: 600;
}

.admin-user-info span {
    color: #999999;
    font-size: 0.78rem;
}

/* =========================
   ROLE BADGES
========================= */

.role-badge {
    padding: 6px 10px;

    border-radius: 999px;

    font-size: 0.72rem;
    font-weight: 600;

    background: rgba(100, 150, 255, 0.14);

    color: #5b7fd6;

    border: 1px solid rgba(100, 150, 255, 0.2);
}

.role-badge.superadmin {
    background: rgba(255, 215, 120, 0.18);

    color: #c58a00;

    border: 1px solid rgba(255, 215, 120, 0.3);
}

/* =========================
   DIVIDER
========================= */

.divider {
    width: 100%;
    height: 1px;

    background: rgba(255, 255, 255, 0.18);

    margin: 22px 0;
}

/* =========================
   FOOTER
========================= */

.footer-text {
    text-align: center;

    margin-top: 18px;

    color: #d2d2d2;

    font-size: 0.74rem;
    font-weight: 300;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes slideUp {

    from {
        opacity: 0;
        transform: translateY(28px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 480px) {

    body {
        padding: 14px;
    }

    .card {
        padding: 34px 24px;
    }

    .card h1 {
        font-size: 1.6rem;
    }

    .welcome-message h2 {
        font-size: 1.55rem;
    }

    .admin-user-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
    }
}
    </script>
</body>
</html>
