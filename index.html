<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Induction - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
        }

        .bg-blur {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            z-index: 1;
        }

        .blur-1 {
            width: 400px;
            height: 400px;
            background: rgba(100, 150, 255, 0.2);
            top: -150px;
            left: -100px;
        }

        .blur-2 {
            width: 350px;
            height: 350px;
            background: rgba(150, 100, 255, 0.15);
            bottom: -80px;
            right: -50px;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .welcome-screen.hidden {
            display: none;
        }

        .login-screen {
            display: none;
        }

        .login-screen.active {
            display: block;
        }

        .card {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 40px 35px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            animation: slideUp 0.6s ease-out;
        }

        .card h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: #666666;
            text-align: center;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .card p {
            text-align: center;
            color: #999999;
            margin-bottom: 20px;
            font-size: 0.9rem;
            font-weight: 300;
        }

        .welcome-message {
            text-align: center;
            color: #666666;
            margin-bottom: 10px;
        }

        .welcome-message h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .welcome-message p {
            color: #999999;
            font-size: 0.95rem;
            font-weight: 300;
        }

        .option-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn,
        .login-btn,
        .secondary-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, rgba(100, 150, 255, 0.4), rgba(150, 100, 255, 0.3));
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            color: #666666;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            backdrop-filter: blur(10px);
        }

        .option-btn:hover,
        .login-btn:hover,
        .secondary-btn:hover {
            background: linear-gradient(135deg, rgba(100, 150, 255, 0.5), rgba(150, 100, 255, 0.4));
            box-shadow: 0 4px 15px rgba(100, 150, 255, 0.2);
            transform: translateY(-2px);
        }

        .option-btn:active,
        .login-btn:active,
        .secondary-btn:active {
            transform: translateY(0);
        }

        .secondary-btn {
            margin-top: 12px;
            padding: 11px;
            display: none;
        }

        .secondary-btn.show {
            display: block;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #999999;
            padding: 10px;
            margin-bottom: 15px;
            cursor: pointer;
            text-align: center;
            font-size: 0.9rem;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            width: 100%;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #777777;
        }

        .role-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px;
            border-radius: 12px;
        }

        .role-selector.hidden {
            display: none;
        }

        .role-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #bbbbbb;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        .role-btn.active {
            background: rgba(255, 255, 255, 0.3);
            color: #666666;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .role-btn:hover {
            color: #888888;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #777777;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            font-size: 0.9rem;
            color: #666666;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            font-weight: 400;
        }

        .form-group input::placeholder {
            color: #cccccc;
        }

        .form-group input:focus {
            outline: none;
            border-color: rgba(100, 150, 255, 0.5);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 0 3px rgba(100, 150, 255, 0.1);
        }

        .status-box {
            display: none;
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            color: #666666;
            background: rgba(100, 150, 255, 0.08);
            border: 1px solid rgba(100, 150, 255, 0.16);
            text-align: center;
        }

        .status-box.show {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 35px 25px;
            }

            .card h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-blur blur-1"></div>
    <div class="bg-blur blur-2"></div>

    <div class="container">
        <div class="welcome-screen" id="welcomeScreen">
            <div class="card">
                <div class="welcome-message">
                    <h2>Welcome</h2>
                    <p>Let's Get Started!</p>
                </div>

                <div class="option-buttons">
                    <button class="option-btn" type="button" onclick="goToScreen('login')">Login</button>
                    <button class="option-btn" type="button" onclick="goToScreen('signup')">Sign Up</button>
                </div>
            </div>
        </div>

        <div class="login-screen" id="loginScreen">
            <button class="back-btn" type="button" onclick="goBack()">← Back</button>

            <div class="card">
                <h1 id="screenTitle">Login</h1>
                <p id="screenSubtitle">Welcome Back</p>

                <div class="status-box" id="sessionStatus"></div>

                <div class="role-selector" id="roleSelector">
                    <button class="role-btn active" type="button" onclick="selectRole('student', this)">Student</button>
                    <button class="role-btn" type="button" onclick="selectRole('admin', this)">Admin</button>
                </div>

                <form id="authForm" onsubmit="handleSubmit(event)">
                    <div class="form-group" id="nameGroup" style="display: none;">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="Enter full name" />
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter email" required />
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter password" required />
                    </div>

                    <button type="submit" class="login-btn" id="submitBtn">Login</button>
                </form>

                <button
                    class="secondary-btn"
                    id="createAdminBtn"
                    type="button"
                    onclick="goToScreen('create-admin')"
                >
                    Create Admin Account
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentRole = 'student';
        let currentMode = 'login';
        let loggedInAdminEmail = null;

        const registeredAdmins = [
            {
                name: 'System Admin',
                email: 'admin@induction.com',
                password: 'admin123'
            }
        ];

        function resetForm() {
            document.getElementById('authForm').reset();
        }

        function setStudentAsDefaultRole() {
            currentRole = 'student';

            document.querySelectorAll('.role-btn').forEach((button) => {
                button.classList.remove('active');
            });

            const firstRoleButton = document.querySelector('.role-btn');
            if (firstRoleButton) {
                firstRoleButton.classList.add('active');
            }
        }

        function showSessionStatus(message = '') {
            const statusBox = document.getElementById('sessionStatus');

            if (!message) {
                statusBox.textContent = '';
                statusBox.classList.remove('show');
                return;
            }

            statusBox.textContent = message;
            statusBox.classList.add('show');
        }

        function updateAdminControls() {
            const createAdminBtn = document.getElementById('createAdminBtn');

            if (loggedInAdminEmail) {
                createAdminBtn.classList.add('show');
                showSessionStatus(`Logged in as admin: ${loggedInAdminEmail}`);
                return;
            }

            createAdminBtn.classList.remove('show');
            showSessionStatus('');
        }

        function goToScreen(mode) {
            currentMode = mode;
            resetForm();

            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.add('active');

            const screenTitle = document.getElementById('screenTitle');
            const screenSubtitle = document.getElementById('screenSubtitle');
            const nameGroup = document.getElementById('nameGroup');
            const submitBtn = document.getElementById('submitBtn');
            const roleSelector = document.getElementById('roleSelector');

            if (mode === 'signup') {
                screenTitle.textContent = 'Student Sign Up';
                screenSubtitle.textContent = 'Create Your Student Account';
                nameGroup.style.display = 'block';
                submitBtn.textContent = 'Sign Up';
                roleSelector.classList.add('hidden');
                setStudentAsDefaultRole();
                updateAdminControls();
                return;
            }

            if (mode === 'create-admin') {
                if (!loggedInAdminEmail) {
                    alert('Only a registered admin who is currently logged in can create another admin account.');
                    goToScreen('login');
                    return;
                }

                screenTitle.textContent = 'Create Admin';
                screenSubtitle.textContent = 'Registered admins can add another admin';
                nameGroup.style.display = 'block';
                submitBtn.textContent = 'Create Admin';
                roleSelector.classList.add('hidden');
                currentRole = 'admin';
                updateAdminControls();
                return;
            }

            screenTitle.textContent = 'Login';
            screenSubtitle.textContent = 'Student or Admin Login';
            nameGroup.style.display = 'none';
            submitBtn.textContent = 'Login';
            roleSelector.classList.remove('hidden');
            setStudentAsDefaultRole();
            updateAdminControls();
        }

        function goBack() {
            document.getElementById('loginScreen').classList.remove('active');
            document.getElementById('welcomeScreen').classList.remove('hidden');
            currentMode = 'login';
            setStudentAsDefaultRole();
            resetForm();
            updateAdminControls();
        }

        function selectRole(role, buttonElement) {
            if (currentMode !== 'login') {
                return;
            }

            currentRole = role;

            document.querySelectorAll('.role-btn').forEach((button) => {
                button.classList.remove('active');
            });

            buttonElement.classList.add('active');
        }

        function findAdminByEmail(email) {
            return registeredAdmins.find(
                (admin) => admin.email.toLowerCase() === email.toLowerCase()
            );
        }

        function handleStudentSignup(email, password, name) {
            if (!name) {
                alert('Please enter your full name.');
                return;
            }

            console.log(`Student sign up attempt: ${name}, ${email}`);
            alert(`Student sign up successful for ${email}.`);
            goToScreen('login');
        }

        function handleLogin(email, password) {
            if (currentRole === 'admin') {
                const admin = findAdminByEmail(email);

                if (!admin || admin.password !== password) {
                    alert('Admin login failed. Only registered admins can log in.');
                    return;
                }

                loggedInAdminEmail = admin.email;
                console.log(`Admin login successful: ${email}`);
                alert(`Admin login successful for ${email}.`);
                goToScreen('login');
                return;
            }

            loggedInAdminEmail = null;
            console.log(`Student login successful: ${email}`);
            alert(`Student login successful for ${email}. Redirecting to induction...`);
            goToScreen('login');
        }

        function handleCreateAdmin(email, password, name) {
            if (!loggedInAdminEmail) {
                alert('Only a logged-in registered admin can create another admin account.');
                return;
            }

            if (!name) {
                alert('Please enter the new admin’s full name.');
                return;
            }

            if (findAdminByEmail(email)) {
                alert('An admin account with this email already exists.');
                return;
            }

            registeredAdmins.push({
                name,
                email,
                password
            });

            console.log(`New admin created by ${loggedInAdminEmail}: ${email}`);
            alert(`Admin account created successfully for ${email}.`);
            goToScreen('login');
        }

        function handleSubmit(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const name = document.getElementById('name').value.trim();

            if (currentMode === 'signup') {
                handleStudentSignup(email, password, name);
                return;
            }

            if (currentMode === 'create-admin') {
                handleCreateAdmin(email, password, name);
                return;
            }

            handleLogin(email, password);
        }

        updateAdminControls();
    </script>
</body>
</html>
