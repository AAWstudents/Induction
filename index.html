<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Induction - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    min-height: 100vh;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
    overflow-x: hidden;
    position: relative;
    padding: 20px;
}

/* Background blur elements */
.bg-blur {
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.3;
    z-index: 1;
}

.blur-1 {
    width: 400px;
    height: 400px;
    background: rgba(100, 150, 255, 0.2);
    top: -150px;
    left: -100px;
}

.blur-2 {
    width: 350px;
    height: 350px;
    background: rgba(150, 100, 255, 0.15);
    bottom: -80px;
    right: -50px;
}

/* Main container */
.container {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 380px;
    padding: 20px;
}

/* Welcome screen */
.welcome-screen {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.welcome-screen.hidden {
    display: none;
}

/* Login screen */
.login-screen {
    display: none;
}

.login-screen.active {
    display: block;
}

/* Admin dashboard screen */
.admin-dashboard {
    display: none;
}

.admin-dashboard.active {
    display: block;
}

/* Frosted card */
.card {
    background: rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-radius: 20px;
    padding: 40px 35px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    animation: slideUp 0.6s ease-out;
}

.card h1 {
    font-size: 1.8rem;
    margin-bottom: 5px;
    color: #666666;
    text-align: center;
    font-weight: 700;
    letter-spacing: -0.5px;
}

.card p {
    text-align: center;
    color: #999999;
    margin-bottom: 25px;
    font-size: 0.9rem;
    font-weight: 300;
}

/* Welcome message */
.welcome-message {
    text-align: center;
    color: #666666;
    margin-bottom: 10px;
}

.welcome-message h2 {
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 8px;
}

.welcome-message p {
    color: #999999;
    font-size: 0.95rem;
    font-weight: 300;
}

/* Option buttons */
.option-buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.option-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, rgba(100, 150, 255, 0.4), rgba(150, 100, 255, 0.3));
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 10px;
    color: #666666;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: 'Poppins', sans-serif;
    backdrop-filter: blur(10px);
}

.option-btn:hover {
    background: linear-gradient(135deg, rgba(100, 150, 255, 0.5), rgba(150, 100, 255, 0.4));
    box-shadow: 0 4px 15px rgba(100, 150, 255, 0.2);
    transform: translateY(-2px);
}

.option-btn:active {
    transform: translateY(0);
}

/* Back button */
.back-btn {
    width: 100%;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #999999;
    padding: 10px;
    margin-bottom: 15px;
    cursor: pointer;
    text-align: center;
    font-size: 0.9rem;
    border-radius: 10px;
    transition: all 0.3s ease;
    font-family: 'Poppins', sans-serif;
    font-weight: 500;
}

.back-btn:hover {
    background: rgba(255, 255, 255, 0.15);
    color: #777777;
}

/* Role selector */
.role-selector {
    display: flex;
    gap: 12px;
    margin-bottom: 25px;
    background: rgba(255, 255, 255, 0.1);
    padding: 6px;
    border-radius: 12px;
}

/* Use this class when public signup should only be student */
.role-selector.student-only {
    display: none;
}

.role-btn {
    flex: 1;
    padding: 8px 12px;
    border: none;
    background: transparent;
    cursor: pointer;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 500;
    color: #bbbbbb;
    transition: all 0.3s ease;
    font-family: 'Poppins', sans-serif;
}

.role-btn.active {
    background: rgba(255, 255, 255, 0.3);
    color: #666666;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
}

.role-btn:hover {
    color: #888888;
}

/* Form group */
.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    color: #777777;
    font-size: 0.85rem;
    font-weight: 500;
}

.form-group input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    background: rgba(255, 255, 255, 0.15);
    border-radius: 10px;
    font-size: 0.9rem;
    color: #666666;
    font-family: 'Poppins', sans-serif;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
    font-weight: 400;
}

.form-group input::placeholder {
    color: #cccccc;
}

.form-group input:focus {
    outline: none;
    border-color: rgba(100, 150, 255, 0.5);
    background: rgba(255, 255, 255, 0.25);
    box-shadow: 0 0 0 3px rgba(100, 150, 255, 0.1);
}

/* Admin notes */
.admin-note {
    background: rgba(100, 150, 255, 0.1);
    border: 1px solid rgba(100, 150, 255, 0.2);
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 18px;
    font-size: 0.8rem;
    color: #888888;
    display: none;
    font-weight: 400;
}

.admin-note.show {
    display: block;
}

/* Login button */
.login-btn,
.admin-create-btn,
.logout-btn {
    width: 100%;
    padding: 11px;
    background: linear-gradient(135deg, rgba(100, 150, 255, 0.4), rgba(150, 100, 255, 0.3));
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 10px;
    color: #666666;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: 'Poppins', sans-serif;
    backdrop-filter: blur(10px);
    margin-top: 5px;
}

.login-btn:hover,
.admin-create-btn:hover,
.logout-btn:hover {
    background: linear-gradient(135deg, rgba(100, 150, 255, 0.5), rgba(150, 100, 255, 0.4));
    box-shadow: 0 4px 15px rgba(100, 150, 255, 0.2);
    transform: translateY(-2px);
}

.login-btn:active,
.admin-create-btn:active,
.logout-btn:active {
    transform: translateY(0);
}

/* Admin dashboard */
.admin-header {
    text-align: center;
    margin-bottom: 22px;
}

.admin-header h2 {
    font-size: 1.5rem;
    color: #666666;
    font-weight: 700;
    margin-bottom: 6px;
}

.admin-header p {
    color: #999999;
    font-size: 0.85rem;
    font-weight: 300;
    margin-bottom: 0;
}

.admin-panel {
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.24);
    border-radius: 14px;
    padding: 18px;
    margin-top: 18px;
    backdrop-filter: blur(10px);
}

.admin-panel-title {
    font-size: 0.95rem;
    color: #666666;
    font-weight: 600;
    margin-bottom: 14px;
    text-align: center;
}

.admin-create-form {
    display: flex;
    flex-direction: column;
}

.admin-create-btn {
    margin-top: 8px;
}

.logout-btn {
    background: rgba(255, 255, 255, 0.12);
    margin-top: 14px;
}

.logout-btn:hover {
    background: rgba(255, 255, 255, 0.2);
}

/* Admin user list */
.admin-list {
    margin-top: 18px;
}

.admin-user-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.14);
    border: 1px solid rgba(255, 255, 255, 0.22);
}

.admin-user-info h3 {
    font-size: 0.85rem;
    color: #666666;
    font-weight: 600;
    margin-bottom: 2px;
}

.admin-user-info span {
    font-size: 0.75rem;
    color: #999999;
}

.role-badge {
    padding: 5px 9px;
    border-radius: 999px;
    background: rgba(100, 150, 255, 0.14);
    border: 1px solid rgba(100, 150, 255, 0.22);
    color: #6683d9;
    font-size: 0.7rem;
    font-weight: 600;
    white-space: nowrap;
}

.role-badge.superadmin {
    background: rgba(255, 215, 120, 0.18);
    border: 1px solid rgba(255, 215, 120, 0.35);
    color: #b68500;
}

/* Security message */
.security-banner {
    background: rgba(255, 220, 120, 0.12);
    border: 1px solid rgba(255, 220, 120, 0.28);
    border-radius: 10px;
    padding: 10px;
    color: #a98400;
    font-size: 0.78rem;
    font-weight: 500;
    text-align: center;
    margin-bottom: 16px;
}

/* Divider */
.divider {
    width: 100%;
    height: 1px;
    background: rgba(255, 255, 255, 0.22);
    margin: 20px 0;
}

/* Footer text */
.footer-text {
    text-align: center;
    margin-top: 18px;
    font-size: 0.75rem;
    color: #dddddd;
    font-weight: 300;
}

/* Animations */
@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

/* Responsive */
@media (max-width: 480px) {
    body {
        align-items: flex-start;
        padding: 16px;
    }

    .container {
        padding: 10px;
    }

    .card {
        padding: 35px 25px;
    }

    .card h1 {
        font-size: 1.5rem;
    }

    .admin-user-card {
        align-items: flex-start;
        flex-direction: column;
    }
}
        }
    </script>
</body>
</html>
