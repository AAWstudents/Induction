<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Induction - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
        }

        .bg-blur {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            z-index: 1;
        }

        .blur-1 {
            width: 400px;
            height: 400px;
            background: rgba(100, 150, 255, 0.2);
            top: -150px;
            left: -100px;
        }

        .blur-2 {
            width: 350px;
            height: 350px;
            background: rgba(150, 100, 255, 0.15);
            bottom: -80px;
            right: -50px;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .welcome-screen.hidden {
            display: none;
        }

        .auth-screen {
            display: none;
        }

        .auth-screen.active {
            display: block;
        }

        .card {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 40px 35px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            animation: slideUp 0.6s ease-out;
        }

        .card h1 {
            font-size: 1.8rem;
            margin-bottom: 24px;
            color: #666666;
            text-align: center;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .welcome-message {
            text-align: center;
            color: #666666;
            margin-bottom: 18px;
        }

        .welcome-message h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .welcome-message p {
            color: #999999;
            font-size: 0.95rem;
            font-weight: 300;
        }

        .option-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn,
        .primary-btn,
        .secondary-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, rgba(100, 150, 255, 0.4), rgba(150, 100, 255, 0.3));
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            color: #666666;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            backdrop-filter: blur(10px);
        }

        .option-btn:hover,
        .primary-btn:hover,
        .secondary-btn:hover {
            background: linear-gradient(135deg, rgba(100, 150, 255, 0.5), rgba(150, 100, 255, 0.4));
            box-shadow: 0 4px 15px rgba(100, 150, 255, 0.2);
            transform: translateY(-2px);
        }

        .option-btn:active,
        .primary-btn:active,
        .secondary-btn:active {
            transform: translateY(0);
        }

        .primary-btn {
            margin-top: 4px;
        }

        .back-inside-btn {
            margin-top: 12px;
        }

        .secondary-btn {
            margin-top: 12px;
            padding: 11px;
            display: none;
        }

        .secondary-btn.show {
            display: block;
        }

        .role-selector {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px;
            border-radius: 12px;
        }

        .role-selector.hidden {
            display: none;
        }

        .role-btn {
            padding: 8px 10px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #bbbbbb;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        .role-btn.active {
            background: rgba(255, 255, 255, 0.3);
            color: #666666;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .role-btn:hover {
            color: #888888;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #777777;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            font-size: 0.9rem;
            color: #666666;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            font-weight: 400;
        }

        .form-group input::placeholder {
            color: #cccccc;
        }

        .form-group input:focus {
            outline: none;
            border-color: rgba(100, 150, 255, 0.5);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 0 3px rgba(100, 150, 255, 0.1);
        }

        .status-box {
            display: none;
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            color: #666666;
            background: rgba(100, 150, 255, 0.08);
            border: 1px solid rgba(100, 150, 255, 0.16);
            text-align: center;
            word-break: break-word;
        }

        .status-box.show {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 35px 25px;
            }

            .card h1 {
                font-size: 1.5rem;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-blur blur-1"></div>
    <div class="bg-blur blur-2"></div>

    <div class="container">
        <div class="welcome-screen" id="welcomeScreen">
            <div class="card">
                <div class="welcome-message">
                    <h2>Induction</h2>
                    <p>Let's Get Started!</p>
                </div>

                <div class="option-buttons">
                    <button class="option-btn" type="button" onclick="goToScreen('login')">Login</button>
                    <button class="option-btn" type="button" onclick="goToScreen('signup')">Sign Up</button>
                </div>
            </div>
        </div>

        <div class="auth-screen" id="authScreen">
            <div class="card">
                <h1 id="screenTitle">Login</h1>

                <div class="status-box" id="sessionStatus"></div>

                <div class="role-selector" id="roleSelector">
                    <button class="role-btn active" type="button" onclick="selectRole('student', this)">Student</button>
                    <button class="role-btn" type="button" onclick="selectRole('admin', this)">Admin</button>
                </div>

                <form id="authForm" onsubmit="handleSubmit(event)">
                    <div class="form-group" id="nameGroup" style="display: none;">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="Enter Full name" />
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter Email" required />
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter Password" required />
                    </div>

                    <button type="submit" class="primary-btn" id="submitBtn">Login</button>
                </form>

                <button class="option-btn back-inside-btn" type="button" onclick="goBack()">Back</button>

                <button
                    class="secondary-btn"
                    id="createAdminBtn"
                    type="button"
                    onclick="goToScreen('create-admin')"
                >
                    Create Admin Account
                </button>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_USERS = [
            {
                name: 'System Admin',
                email: 'admin@induction.com',
                password: 'admin123',
                role: 'admin'
            },
            {
                name: 'Pandora Burns',
                email: 'pandoraburns@btinternet.com',
                password: 'ChangeMeNow123!',
                role: 'superuser'
            }
        ];

        let currentRole = 'student';
        let currentMode = 'login';

        function getStoredUsers() {
            const rawUsers = localStorage.getItem('inductionUsers');

            if (!rawUsers) {
                localStorage.setItem('inductionUsers', JSON.stringify(DEFAULT_USERS));
                return [...DEFAULT_USERS];
            }

            try {
                const parsedUsers = JSON.parse(rawUsers);
                return Array.isArray(parsedUsers) ? parsedUsers : [...DEFAULT_USERS];
            } catch {
                localStorage.setItem('inductionUsers', JSON.stringify(DEFAULT_USERS));
                return [...DEFAULT_USERS];
            }
        }

        function saveUsers(users) {
            localStorage.setItem('inductionUsers', JSON.stringify(users));
        }

        function getSession() {
            const rawSession = localStorage.getItem('inductionSession');

            if (!rawSession) {
                return null;
            }

            try {
                return JSON.parse(rawSession);
            } catch {
                localStorage.removeItem('inductionSession');
                return null;
            }
        }

        function saveSession(session) {
            localStorage.setItem('inductionSession', JSON.stringify(session));
        }

        function clearSession() {
            localStorage.removeItem('inductionSession');
        }

        function resetForm() {
            document.getElementById('authForm').reset();
        }

        function setDefaultRole() {
            const firstRoleButton = document.querySelectorAll('.role-btn')[0];
            selectRole('student', firstRoleButton);
        }

        function showSessionStatus(message = '') {
            const statusBox = document.getElementById('sessionStatus');
            statusBox.textContent = message;
            statusBox.classList.toggle('show', Boolean(message));
        }

        function canManageAdmins(session) {
            return Boolean(session && (session.role === 'admin' || session.role === 'superuser'));
        }

        function updatePrivilegedControls() {
            const session = getSession();
            const createAdminBtn = document.getElementById('createAdminBtn');

            if (canManageAdmins(session)) {
                createAdminBtn.classList.add('show');
                showSessionStatus(`Logged in as ${session.role}: ${session.email}`);
                return;
            }

            createAdminBtn.classList.remove('show');
            showSessionStatus('');
        }

        function redirectToDashboard() {
            window.location.href = 'dashboard.html';
        }

        function goToScreen(mode) {
            currentMode = mode;
            resetForm();

            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('authScreen').classList.add('active');

            const screenTitle = document.getElementById('screenTitle');
            const nameGroup = document.getElementById('nameGroup');
            const roleSelector = document.getElementById('roleSelector');
            const submitBtn = document.getElementById('submitBtn');
            const passwordInput = document.getElementById('password');

            if (mode === 'signup') {
                screenTitle.textContent = 'Sign Up';
                nameGroup.style.display = 'block';
                roleSelector.classList.add('hidden');
                submitBtn.textContent = 'Sign Up';
                passwordInput.required = true;
                currentRole = 'student';
                updatePrivilegedControls();
                return;
            }

            if (mode === 'create-admin') {
                const session = getSession();

                if (!canManageAdmins(session)) {
                    alert('Only a logged-in admin or superuser can create another admin account.');
                    goToScreen('login');
                    return;
                }

                screenTitle.textContent = 'Create Admin';
                nameGroup.style.display = 'block';
                roleSelector.classList.add('hidden');
                submitBtn.textContent = 'Create Admin';
                passwordInput.required = true;
                currentRole = 'admin';
                updatePrivilegedControls();
                return;
            }

            screenTitle.textContent = 'Login';
            nameGroup.style.display = 'none';
            roleSelector.classList.remove('hidden');
            submitBtn.textContent = 'Login';
            passwordInput.required = true;
            setDefaultRole();
            updatePrivilegedControls();
        }

        function goBack() {
            document.getElementById('authScreen').classList.remove('active');
            document.getElementById('welcomeScreen').classList.remove('hidden');
            currentMode = 'login';
            resetForm();
            setDefaultRole();
            updatePrivilegedControls();
        }

        function selectRole(role, buttonElement) {
            if (currentMode !== 'login') {
                return;
            }

            currentRole = role;

            document.querySelectorAll('.role-btn').forEach((button) => {
                button.classList.remove('active');
            });

            if (buttonElement) {
                buttonElement.classList.add('active');
            }
        }

        function findPrivilegedUserByEmail(email) {
            return getStoredUsers().find(
                (user) => user.email.toLowerCase() === email.toLowerCase()
            );
        }

        function handleStudentSignup(email, password, name) {
            if (!name) {
                alert('Please enter your full name.');
                return;
            }

            console.log(`Student sign up attempt: ${name}, ${email}`);
            alert(`Student sign up successful for ${email}.`);
            goToScreen('login');
        }

        function handlePrivilegedLogin(email, password) {
            const user = findPrivilegedUserByEmail(email);

            if (!user || (user.role !== 'admin' && user.role !== 'superuser') || user.password !== password) {
                alert('Admin login failed. Invalid email or password.');
                return;
            }

            saveSession({
                name: user.name,
                email: user.email,
                role: user.role
            });

            alert(`${user.role.charAt(0).toUpperCase() + user.role.slice(1)} login successful for ${email}.`);
            redirectToDashboard();
        }

        function handleStudentLogin(email) {
            clearSession();
            saveSession({
                name: 'Student',
                email,
                role: 'student'
            });

            alert(`Student login successful for ${email}.`);
            redirectToDashboard();
        }

        function handleLogin(email, password) {
            if (currentRole === 'admin') {
                handlePrivilegedLogin(email, password);
                return;
            }

            handleStudentLogin(email);
        }

        function handleCreateAdmin(email, password, name) {
            const session = getSession();

            if (!canManageAdmins(session)) {
                alert('Only a logged-in admin or superuser can create another admin account.');
                return;
            }

            if (!name) {
                alert('Please enter the new admin name.');
                return;
            }

            if (findPrivilegedUserByEmail(email)) {
                alert('A privileged account with this email already exists.');
                return;
            }

            const users = getStoredUsers();
            users.push({
                name,
                email,
                password,
                role: 'admin'
            });
            saveUsers(users);

            alert(`Admin account created successfully for ${email}.`);
            goToScreen('login');
        }

        function handleSubmit(event) {
            event.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (currentMode === 'signup') {
                handleStudentSignup(email, password, name);
                return;
            }

            if (currentMode === 'create-admin') {
                handleCreateAdmin(email, password, name);
                return;
            }

            handleLogin(email, password);
        }

        getStoredUsers();
        updatePrivilegedControls();
    </script>
</body>
</html>
