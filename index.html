<!-- /index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Induction - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
        }

        .bg-blur {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            z-index: 1;
        }

        .blur-1 {
            width: 400px;
            height: 400px;
            background: rgba(100, 150, 255, 0.2);
            top: -150px;
            left: -100px;
        }

        .blur-2 {
            width: 350px;
            height: 350px;
            background: rgba(150, 100, 255, 0.15);
            bottom: -80px;
            right: -50px;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .welcome-screen.hidden {
            display: none;
        }

        .auth-screen {
            display: none;
        }

        .auth-screen.active {
            display: block;
        }

        .card {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 36px 35px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            animation: slideUp 0.6s ease-out;
        }

        .card h1 {
            font-size: 1.8rem;
            margin-bottom: 22px;
            color: #666666;
            text-align: center;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .welcome-message {
            text-align: center;
            color: #666666;
            margin-bottom: 14px;
        }

        .welcome-message h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 0;
        }

        .screen-copy {
            text-align: center;
            color: #8a8a8a;
            font-size: 0.9rem;
            line-height: 1.6;
            margin: -10px 0 18px;
        }

        .option-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn,
        .primary-btn,
        .secondary-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, rgba(100, 150, 255, 0.4), rgba(150, 100, 255, 0.3));
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            color: #666666;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            backdrop-filter: blur(10px);
        }

        .option-btn:hover,
        .primary-btn:hover,
        .secondary-btn:hover {
            background: linear-gradient(135deg, rgba(100, 150, 255, 0.5), rgba(150, 100, 255, 0.4));
            box-shadow: 0 4px 15px rgba(100, 150, 255, 0.2);
            transform: translateY(-2px);
        }

        .option-btn:active,
        .primary-btn:active,
        .secondary-btn:active {
            transform: translateY(0);
        }

        .primary-btn {
            margin-top: 4px;
        }

        .forgot-password-btn,
        .back-inside-btn {
            margin-top: 12px;
        }

        .secondary-btn {
            margin-top: 12px;
            padding: 11px;
            display: none;
        }

        .secondary-btn.show {
            display: block;
        }

        .role-selector {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 22px;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px;
            border-radius: 12px;
        }

        .role-selector.hidden {
            display: none;
        }

        .role-btn {
            padding: 8px 10px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #bbbbbb;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        .role-btn.active {
            background: rgba(255, 255, 255, 0.3);
            color: #666666;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .role-btn:hover {
            color: #888888;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group.hidden {
            display: none;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #777777;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .input-wrap {
            position: relative;
        }

        .form-group input {
            width: 100%;
            padding: 10px 56px 10px 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            font-size: 0.9rem;
            color: #666666;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            font-weight: 400;
        }

        .plain-input input[type="email"],
        .plain-input input[type="text"] {
            padding-right: 12px;
        }

        .form-group input::placeholder {
            color: #cccccc;
        }

        .form-group input:focus {
            outline: none;
            border-color: rgba(100, 150, 255, 0.5);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 0 3px rgba(100, 150, 255, 0.1);
        }

        .form-group input[readonly] {
            opacity: 0.85;
        }

        .toggle-password-btn {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #777777;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            padding: 4px 6px;
        }

        .toggle-password-btn:hover {
            color: #555555;
        }

        .status-box {
            display: none;
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            color: #666666;
            background: rgba(100, 150, 255, 0.08);
            border: 1px solid rgba(100, 150, 255, 0.16);
            text-align: center;
            word-break: break-word;
            line-height: 1.5;
        }

        .status-box.show {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 32px 25px;
            }

            .card h1 {
                font-size: 1.5rem;
                margin-bottom: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-blur blur-1"></div>
    <div class="bg-blur blur-2"></div>

    <div class="container">
        <div class="welcome-screen" id="welcomeScreen">
            <div class="card">
                <div class="welcome-message">
                    <h2>Welcome</h2>
                </div>

                <div class="option-buttons">
                    <button class="option-btn" type="button" onclick="goToScreen('login')">Login</button>
                    <button class="option-btn" type="button" onclick="goToScreen('signup')">Sign Up</button>
                </div>
            </div>
        </div>

        <div class="auth-screen" id="authScreen">
            <div class="card">
                <h1 id="screenTitle">Login</h1>
                <p class="screen-copy" id="screenCopy" style="display: none;"></p>

                <div class="status-box" id="sessionStatus"></div>

                <div class="role-selector" id="roleSelector">
                    <button class="role-btn active" type="button" onclick="selectRole('student', this)">Student</button>
                    <button class="role-btn" type="button" onclick="selectRole('admin', this)">Admin</button>
                </div>

                <form id="authForm" onsubmit="handleSubmit(event)">
                    <div class="form-group hidden" id="nameGroup">
                        <label for="name">Full Name</label>
                        <div class="input-wrap plain-input">
                            <input type="text" id="name" placeholder="Enter Full Name" />
                        </div>
                    </div>

                    <div class="form-group" id="emailGroup">
                        <label for="email">Email</label>
                        <div class="input-wrap plain-input">
                            <input type="email" id="email" placeholder="Enter Email" required />
                        </div>
                    </div>

                    <div class="form-group" id="passwordGroup">
                        <label for="password">Password</label>
                        <div class="input-wrap">
                            <input type="password" id="password" placeholder="Enter Password" required />
                            <button class="toggle-password-btn" type="button" onclick="togglePassword('password', this)">Show</button>
                        </div>
                    </div>

                    <div class="form-group hidden" id="confirmPasswordGroup">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="input-wrap">
                            <input type="password" id="confirmPassword" placeholder="Confirm Password" />
                            <button class="toggle-password-btn" type="button" onclick="togglePassword('confirmPassword', this)">Show</button>
                        </div>
                    </div>

                    <button type="submit" class="primary-btn" id="submitBtn">Login</button>
                </form>

                <button
                    class="option-btn forgot-password-btn"
                    id="forgotPasswordBtn"
                    type="button"
                    onclick="goToScreen('forgot-password')"
                >
                    Forgot Password?
                </button>

                <button class="option-btn back-inside-btn" type="button" onclick="goBack()">Back</button>

                <button
                    class="secondary-btn"
                    id="createAdminBtn"
                    type="button"
                    onclick="goToScreen('create-admin')"
                >
                    Create Admin Account
                </button>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_ADMIN_PASSWORD = 'ChangeThisNow123!';
        const DEFAULT_USERS = [
            {
                name: 'System Admin',
                email: 'admin@induction.com',
                password: DEFAULT_ADMIN_PASSWORD,
                role: 'admin',
                mustChangePassword: false
            },
            {
                name: 'Pandora Burns',
                email: 'pandoraburns@btinternet.com',
                password: DEFAULT_ADMIN_PASSWORD,
                role: 'superuser',
                mustChangePassword: false
            }
        ];

        let currentRole = 'student';
        let currentMode = 'login';

        function isPrivilegedRole(role) {
            return role === 'admin' || role === 'superuser' || role === 'super-admin';
        }

        function normalizePrivilegedRole(role) {
            return role === 'super-admin' ? 'superuser' : role;
        }

        function mergeDefaultUsers(users) {
            const mergedUsers = [...users];

            DEFAULT_USERS.forEach((defaultUser) => {
                const existingIndex = mergedUsers.findIndex(
                    (user) => user.email.toLowerCase() === defaultUser.email.toLowerCase()
                );

                if (existingIndex === -1) {
                    mergedUsers.push(defaultUser);
                    return;
                }

                mergedUsers[existingIndex] = {
                    mustChangePassword: false,
                    ...defaultUser,
                    ...mergedUsers[existingIndex],
                    role: normalizePrivilegedRole(mergedUsers[existingIndex].role || defaultUser.role)
                };
            });

            return mergedUsers.map((user) => ({
                mustChangePassword: false,
                ...user,
                role: normalizePrivilegedRole(user.role)
            }));
        }

        function getStoredUsers() {
            const rawUsers = localStorage.getItem('inductionUsers');

            if (!rawUsers) {
                const seededUsers = mergeDefaultUsers([]);
                localStorage.setItem('inductionUsers', JSON.stringify(seededUsers));
                return seededUsers;
            }

            try {
                const parsedUsers = JSON.parse(rawUsers);

                if (Array.isArray(parsedUsers)) {
                    const mergedUsers = mergeDefaultUsers(parsedUsers);
                    localStorage.setItem('inductionUsers', JSON.stringify(mergedUsers));
                    return mergedUsers;
                }
            } catch (error) {
                console.error('Failed to parse stored users.', error);
            }

            const fallbackUsers = mergeDefaultUsers([]);
            localStorage.setItem('inductionUsers', JSON.stringify(fallbackUsers));
            return fallbackUsers;
        }

        function saveUsers(users) {
            localStorage.setItem('inductionUsers', JSON.stringify(mergeDefaultUsers(users)));
        }

        function getSession() {
            const rawSession = localStorage.getItem('inductionSession');

            if (!rawSession) {
                return null;
            }

            try {
                const session = JSON.parse(rawSession);
                return session
                    ? {
                          ...session,
                          role: normalizePrivilegedRole(session.role)
                      }
                    : null;
            } catch (error) {
                console.error('Failed to parse session.', error);
                localStorage.removeItem('inductionSession');
                return null;
            }
        }

        function saveSession(session) {
            localStorage.setItem(
                'inductionSession',
                JSON.stringify({
                    ...session,
                    role: normalizePrivilegedRole(session.role)
                })
            );
        }

        function resetForm() {
            document.getElementById('authForm').reset();
            document.getElementById('email').readOnly = false;
            resetPasswordToggles();
        }

        function resetPasswordToggles() {
            ['password', 'confirmPassword'].forEach((inputId) => {
                const input = document.getElementById(inputId);

                if (!input) {
                    return;
                }

                input.type = 'password';

                const toggleButton = input.parentElement.querySelector('.toggle-password-btn');
                if (toggleButton) {
                    toggleButton.textContent = 'Show';
                }
            });
        }

        function togglePassword(inputId, buttonElement) {
            const input = document.getElementById(inputId);

            if (!input) {
                return;
            }

            const shouldShow = input.type === 'password';
            input.type = shouldShow ? 'text' : 'password';
            buttonElement.textContent = shouldShow ? 'Hide' : 'Show';
        }

        function setDefaultRole() {
            currentRole = 'student';

            document.querySelectorAll('.role-btn').forEach((button) => {
                button.classList.remove('active');
            });

            const firstRoleButton = document.querySelector('.role-btn');
            if (firstRoleButton) {
                firstRoleButton.classList.add('active');
            }
        }

        function showSessionStatus(message = '') {
            const statusBox = document.getElementById('sessionStatus');
            statusBox.textContent = message;
            statusBox.classList.toggle('show', Boolean(message));
        }

        function showScreenCopy(message = '') {
            const screenCopy = document.getElementById('screenCopy');
            screenCopy.textContent = message;
            screenCopy.style.display = message ? 'block' : 'none';
        }

        function canManageAdmins(session) {
            return Boolean(session && isPrivilegedRole(session.role));
        }

        function updatePrivilegedControls() {
            const session = getSession();
            const createAdminBtn = document.getElementById('createAdminBtn');
            const showCreateAdmin = canManageAdmins(session) && currentMode !== 'forgot-password' && currentMode !== 'set-password';

            createAdminBtn.classList.toggle('show', showCreateAdmin);

            if (showCreateAdmin) {
                showSessionStatus(`Logged in as ${session.role}: ${session.email}`);
                return;
            }

            if (currentMode !== 'set-password' && currentMode !== 'create-admin' && currentMode !== 'forgot-password') {
                showSessionStatus('');
            }
        }

        function updateForgotPasswordVisibility() {
            const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');
            forgotPasswordBtn.style.display = currentMode === 'login' ? 'block' : 'none';
        }

        function configureBaseScreen() {
            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('authScreen').classList.add('active');

            document.getElementById('nameGroup').classList.add('hidden');
            document.getElementById('roleSelector').classList.remove('hidden');
            document.getElementById('passwordGroup').classList.remove('hidden');
            document.getElementById('confirmPasswordGroup').classList.add('hidden');

            document.getElementById('password').required = true;
            document.getElementById('confirmPassword').required = false;
            document.getElementById('password').placeholder = 'Enter Password';
            document.getElementById('confirmPassword').placeholder = 'Confirm Password';
            document.getElementById('submitBtn').textContent = 'Login';

            showScreenCopy('');
            showSessionStatus('');
        }

        function redirectToDashboard() {
            window.location.href = 'dashboard.html';
        }

        function configurePasswordSetupScreen(email, message = 'Create your own password before continuing.') {
            currentMode = 'set-password';
            resetForm();
            configureBaseScreen();

            document.getElementById('screenTitle').textContent = 'Create Password';
            document.getElementById('roleSelector').classList.add('hidden');
            document.getElementById('confirmPasswordGroup').classList.remove('hidden');
            document.getElementById('submitBtn').textContent = 'Save Password';
            document.getElementById('email').value = email;
            document.getElementById('email').readOnly = true;
            document.getElementById('password').placeholder = 'Create New Password';
            document.getElementById('confirmPassword').required = true;

            showScreenCopy(message);
            updatePrivilegedControls();
            updateForgotPasswordVisibility();
        }

        function goToScreen(mode) {
            currentMode = mode;
            resetForm();
            configureBaseScreen();

            const session = getSession();
            const screenTitle = document.getElementById('screenTitle');
            const nameGroup = document.getElementById('nameGroup');
            const roleSelector = document.getElementById('roleSelector');
            const submitBtn = document.getElementById('submitBtn');
            const passwordInput = document.getElementById('password');
            const confirmPasswordGroup = document.getElementById('confirmPasswordGroup');

            if (mode === 'signup') {
                screenTitle.textContent = 'Sign Up';
                nameGroup.classList.remove('hidden');
                roleSelector.classList.add('hidden');
                submitBtn.textContent = 'Sign Up';
                currentRole = 'student';
                showScreenCopy('Create your student account to continue.');
                updatePrivilegedControls();
                updateForgotPasswordVisibility();
                return;
            }

            if (mode === 'create-admin') {
                if (!canManageAdmins(session)) {
                    alert('Only a logged-in admin or superuser can create another admin account.');
                    goToScreen('login');
                    return;
                }

                screenTitle.textContent = 'Create Admin';
                nameGroup.classList.remove('hidden');
                roleSelector.classList.add('hidden');
                submitBtn.textContent = 'Create Admin';
                passwordInput.required = false;
                passwordInput.value = DEFAULT_ADMIN_PASSWORD;
                passwordInput.placeholder = 'Temporary Password';
                currentRole = 'admin';
                showScreenCopy('New admin users will sign in with the temporary password and then create their own password.');
                showSessionStatus(`Temporary password: ${DEFAULT_ADMIN_PASSWORD}`);
                updatePrivilegedControls();
                updateForgotPasswordVisibility();
                return;
            }

            if (mode === 'forgot-password') {
                screenTitle.textContent = 'Forgot Password';
                roleSelector.classList.add('hidden');
                passwordInput.required = false;
                passwordInput.value = '';
                passwordInput.placeholder = 'Not needed here';
                document.getElementById('passwordGroup').classList.add('hidden');
                confirmPasswordGroup.classList.add('hidden');
                submitBtn.textContent = 'Reset Password';
                showScreenCopy('Enter your email address to reset your password.');
                showSessionStatus('');
                updatePrivilegedControls();
                updateForgotPasswordVisibility();
                return;
            }

            screenTitle.textContent = 'Login';
            setDefaultRole();
            showScreenCopy('');
            updatePrivilegedControls();
            updateForgotPasswordVisibility();
        }

        function goBack() {
            const pendingRaw = localStorage.getItem('pendingPasswordSetup');

            if (currentMode === 'set-password' && pendingRaw) {
                localStorage.removeItem('pendingPasswordSetup');
            }

            document.getElementById('authScreen').classList.remove('active');
            document.getElementById('welcomeScreen').classList.remove('hidden');
            currentMode = 'login';
            resetForm();
            setDefaultRole();
            showSessionStatus('');
            showScreenCopy('');
            updatePrivilegedControls();
            updateForgotPasswordVisibility();
        }

        function selectRole(role, buttonElement) {
            if (currentMode !== 'login') {
                return;
            }

            currentRole = role;

            document.querySelectorAll('.role-btn').forEach((button) => {
                button.classList.remove('active');
            });

            if (buttonElement) {
                buttonElement.classList.add('active');
            }
        }

        function findUserByEmail(email) {
            return getStoredUsers().find(
                (user) => user.email.toLowerCase() === email.toLowerCase()
            );
        }

        function updateUser(updatedUser) {
            const users = getStoredUsers().map((user) =>
                user.email.toLowerCase() === updatedUser.email.toLowerCase()
                    ? {
                          ...updatedUser,
                          role: normalizePrivilegedRole(updatedUser.role)
                      }
                    : user
            );
            saveUsers(users);
        }

        function handleStudentSignup(email, _password, name) {
            if (!name) {
                alert('Please enter your full name.');
                return;
            }

            alert(`Student sign up successful for ${email}.`);
            goToScreen('login');
        }

        function handlePrivilegedLogin(email, password) {
            const user = findUserByEmail(email);

            if (!user || !isPrivilegedRole(user.role) || user.password !== password) {
                alert('Admin login failed. Invalid email or password.');
                return;
            }

            if (user.mustChangePassword) {
                localStorage.setItem(
                    'pendingPasswordSetup',
                    JSON.stringify({
                        email: user.email
                    })
                );
                configurePasswordSetupScreen(user.email);
                return;
            }

            saveSession({
                name: user.name,
                email: user.email,
                role: user.role
            });

            alert(`${user.role} login successful for ${email}.`);
            redirectToDashboard();
        }

        function handleStudentLogin(email) {
            saveSession({
                name: 'Student',
                email,
                role: 'student'
            });

            alert(`Student login successful for ${email}.`);
            redirectToDashboard();
        }

        function handleLogin(email, password) {
            if (currentRole === 'admin') {
                handlePrivilegedLogin(email, password);
                return;
            }

            handleStudentLogin(email);
        }

        function handleCreateAdmin(email, _password, name) {
            const session = getSession();

            if (!canManageAdmins(session)) {
                alert('Only a logged-in admin or superuser can create another admin account.');
                return;
            }

            if (!name) {
                alert('Please enter the new admin name.');
                return;
            }

            if (findUserByEmail(email)) {
                alert('A user with this email already exists.');
                return;
            }

            const users = getStoredUsers();
            users.push({
                name,
                email: email.toLowerCase(),
                password: DEFAULT_ADMIN_PASSWORD,
                role: 'admin',
                mustChangePassword: true
            });
            saveUsers(users);

            alert(`Admin account created successfully for ${email}.\nTemporary password: ${DEFAULT_ADMIN_PASSWORD}`);
            goToScreen('login');
        }

        function handlePasswordSetup(password, confirmPassword) {
            const pendingRaw = localStorage.getItem('pendingPasswordSetup');

            if (!pendingRaw) {
                alert('Password setup session expired. Please log in again.');
                goToScreen('login');
                return;
            }

            let pendingUser;

            try {
                pendingUser = JSON.parse(pendingRaw);
            } catch (error) {
                console.error('Failed to parse pending password setup.', error);
                localStorage.removeItem('pendingPasswordSetup');
                goToScreen('login');
                return;
            }

            const user = findUserByEmail(pendingUser.email);

            if (!user) {
                alert('User account was not found.');
                localStorage.removeItem('pendingPasswordSetup');
                goToScreen('login');
                return;
            }

            if (password.length < 8) {
                alert('Password must be at least 8 characters long.');
                return;
            }

            if (password !== confirmPassword) {
                alert('Passwords do not match.');
                return;
            }

            const updatedUser = {
                ...user,
                password,
                mustChangePassword: false
            };

            updateUser(updatedUser);
            localStorage.removeItem('pendingPasswordSetup');

            saveSession({
                name: updatedUser.name,
                email: updatedUser.email,
                role: updatedUser.role
            });

            alert('Password created successfully.');
            redirectToDashboard();
        }

        function handleForgotPassword(email) {
            const normalizedEmail = email.toLowerCase();
            const user = findUserByEmail(normalizedEmail);

            if (!user) {
                showSessionStatus('No account was found for that email.');
                return;
            }

            if (isPrivilegedRole(user.role)) {
                const updatedUser = {
                    ...user,
                    password: DEFAULT_ADMIN_PASSWORD,
                    mustChangePassword: true
                };

                updateUser(updatedUser);

                localStorage.setItem(
                    'pendingPasswordSetup',
                    JSON.stringify({
                        email: updatedUser.email
                    })
                );

                configurePasswordSetupScreen(
                    updatedUser.email,
                    `Password reset successful for ${updatedUser.email}. Create a new password below to reaccess your account.`
                );
                showSessionStatus(`Temporary password reset completed for ${updatedUser.email}.`);
                return;
            }

            showSessionStatus('Student password reset is not connected yet. Please contact your administrator.');
        }

        function handleSubmit(event) {
            event.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();

            if (!email) {
                alert('Please enter your email.');
                return;
            }

            if (currentMode === 'signup') {
                handleStudentSignup(email, password, name);
                return;
            }

            if (currentMode === 'create-admin') {
                handleCreateAdmin(email, password, name);
                return;
            }

            if (currentMode === 'set-password') {
                handlePasswordSetup(password, confirmPassword);
                return;
            }

            if (currentMode === 'forgot-password') {
                handleForgotPassword(email);
                return;
            }

            handleLogin(email, password);
        }

        function restorePendingPasswordSetup() {
            const pendingRaw = localStorage.getItem('pendingPasswordSetup');

            if (!pendingRaw) {
                return;
            }

            try {
                const pendingUser = JSON.parse(pendingRaw);

                if (pendingUser && pendingUser.email) {
                    configurePasswordSetupScreen(pendingUser.email);
                }
            } catch (error) {
                console.error('Failed to restore pending password setup.', error);
                localStorage.removeItem('pendingPasswordSetup');
            }
        }

        getStoredUsers();
        updatePrivilegedControls();
        updateForgotPasswordVisibility();
        restorePendingPasswordSetup();
    </script>
</body>
</html>
